<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>0E5O WEBHOOK</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }
    .box {
      width: min(480px, 92vw);
      background: #0a0a0a;
      border: 1px solid #262626;
      border-radius: 28px;
      padding: 40px 32px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      text-align: left;
    }
    .mark {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      margin: 0 auto 24px;
      background: #171717;
      border: 1px solid #333333;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }
    .mark svg {
      width: 36px;
      height: 36px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
      color: #ffffff;
    }
    h1 b {
      color: #a3a3a3;
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #121212;
      border: 1px solid #262626;
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .tab-btn {
      background: transparent;
      border: 0;
      color: #737373;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #ffffff;
      color: #000000;
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #737373;
      margin-bottom: 8px;
    }
    .field input, .field textarea, .field select {
      width: 100%;
      border: 1px solid #262626;
      border-radius: 14px;
      padding: 12px 16px;
      font: 600 13px Consolas, 'Courier New', monospace;
      background: #121212;
      color: #ffffff;
      transition: all 0.2s ease;
      resize: none;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      outline: none;
      border-color: #ffffff;
      background: #1a1a1a;
    }
    .profile-select-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .profile-preview-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid #333333;
      object-fit: cover;
      background: #171717;
      flex-shrink: 0;
    }
    .img-upload-box {
      border: 1px dashed #333333;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      background: #121212;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .img-upload-box:hover {
      border-color: #737373;
      background: #171717;
    }
    .img-upload-box input[type="file"] {
      display: none;
    }
    .img-upload-text {
      font-size: 12px;
      color: #737373;
      font-weight: 600;
    }
    .img-preview-container {
      display: none;
      position: relative;
      margin-top: 10px;
      text-align: center;
    }
    .img-preview-container.active {
      display: block;
    }
    .img-preview {
      max-width: 100%;
      max-height: 180px;
      border-radius: 12px;
      border: 1px solid #333333;
      object-fit: contain;
    }
    .remove-img-btn {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #dc2626;
      color: #ffffff;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      line-height: 24px;
      text-align: center;
    }
    button.btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      background: #ffffff;
      color: #000000;
      font: 800 14px inherit;
      transition: all 0.2s ease;
      margin-top: 6px;
    }
    button.btn:hover {
      background: #e5e5e5;
      transform: translateY(-1px);
    }
    button.btn.running {
      background: #dc2626 !important;
      color: #ffffff !important;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .toast {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }
    .toast.success {
      display: block;
      background: #121f15;
      border: 1px solid #1a4522;
      color: #4ade80;
    }
    .toast.error {
      display: block;
      background: #1f1212;
      border: 1px solid #451a1a;
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </div>
    <h1>0E5O <b>WEBHOOK</b></h1>

    <div class="field">
      <label for="webhookUrl">웹훅 주소 (WEBHOOK URL)</label>
      <input id="webhookUrl" spellcheck="false" autocomplete="off" placeholder="https://discord.com/api/webhooks/..." oninput="saveWebhook(this.value)">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('message', event)">Message</button>
      <button class="tab-btn" onclick="switchTab('embed', event)">Embed</button>
      <button class="tab-btn" onclick="switchTab('terror', event)">테러</button>
    </div>

    <!-- MESSAGE TAB -->
    <div id="tab-message" class="tab-content active">
      <div class="field">
        <label for="msgUsername">보내는 사람 이름 (USERNAME - 선택)</label>
        <input id="msgUsername" spellcheck="false" autocomplete="off" placeholder="이름 입력">
      </div>
      <div class="field">
        <label>프로필 사진 설정</label>
        <div class="profile-select-row">
          <img id="msgAvatarPreviewImg" class="profile-preview-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="preview">
          <select id="msgAvatarPreset" onchange="updatePresetPreview('msg')">
            <option value="blue" selected>Blue (파란색)</option>
            <option value="gray">Gray (회색)</option>
            <option value="green">Green (초록색)</option>
            <option value="orange">Orange (주황색)</option>
            <option value="red">Red (빨간색)</option>
            <option value="pink">Pink (분홍색)</option>
            <option value="custom">커스텀 이미지 파일 사용</option>
          </select>
        </div>
      </div>
      
      <div class="field" id="msgCustomAvatarBox" style="display: none;">
        <label>프로필 커스텀 이미지</label>
        <div class="img-upload-box" onclick="document.getElementById('msgProfileFile').click()">
          <span class="img-upload-text">📁 파일 탐색기 열기</span>
          <input type="file" id="msgProfileFile" accept="image/*" onchange="handleProfileFileSelect(this, 'msg')">
        </div>
      </div>

      <div class="field">
        <label for="msgContent">일반 메시지 내용</label>
        <textarea id="msgContent" rows="3" placeholder="메시지 입력"></textarea>
      </div>
      <div class="field">
        <label>메시지 본문 이미지 첨부 (선택)</label>
        <div class="img-upload-box" onclick="document.getElementById('msgFile').click()">
          <span class="img-upload-text">📁 파일 탐색기 열기</span>
          <input type="file" id="msgFile" accept="image/*" onchange="handleFileSelect(this, 'msg')">
        </div>
        <div id="preview-container-msg" class="img-preview-container">
          <img id="preview-msg" class="img-preview" src="" alt="preview">
          <button class="remove-img-btn" onclick="clearImage('msg')">✕</button>
        </div>
      </div>
      <button class="btn" onclick="sendSingle('message')">메시지 전송</button>
    </div>

    <!-- EMBED TAB -->
    <div id="tab-embed" class="tab-content">
      <div class="field">
        <label for="embedUsername">보내는 사람 이름 (USERNAME - 선택)</label>
        <input id="embedUsername" spellcheck="false" autocomplete="off" placeholder="이름 입력">
      </div>
      <div class="field">
        <label>프로필 사진 설정</label>
        <div class="profile-select-row">
          <img id="embedAvatarPreviewImg" class="profile-preview-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="preview">
          <select id="embedAvatarPreset" onchange="updatePresetPreview('embed')">
            <option value="blue" selected>Blue (파란색)</option>
            <option value="gray">Gray (회색)</option>
            <option value="green">Green (초록색)</option>
            <option value="orange">Orange (주황색)</option>
            <option value="red">Red (빨간색)</option>
            <option value="pink">Pink (분홍색)</option>
            <option value="custom">커스텀 이미지 파일 사용</option>
          </select>
        </div>
      </div>

      <div class="field" id="embedCustomAvatarBox" style="display: none;">
        <label>프로필 커스텀 이미지</label>
        <div class="img-upload-box" onclick="document.getElementById('embedProfileFile').click()">
          <span class="img-upload-text">📁 파일 탐색기 열기</span>
          <input type="file" id="embedProfileFile" accept="image/*" onchange="handleProfileFileSelect(this, 'embed')">
        </div>
      </div>

      <div class="field">
        <label for="embedTitle">임베드 제목 (TITLE)</label>
        <input id="embedTitle" placeholder="제목 입력">
      </div>
      <div class="field">
        <label for="embedColor">임베드 테두리 색상</label>
        <select id="embedColor">
          <option value="Red">Red</option>
          <option value="Orange">Orange</option>
          <option value="Yellow">Yellow</option>
          <option value="Green">Green</option>
          <option value="Blue" selected>Blue</option>
          <option value="Indigo">Indigo</option>
          <option value="Purple">Purple</option>
          <option value="White">White</option>
          <option value="Black">Black</option>
        </select>
      </div>
      <div class="field">
        <label for="embedContent">임베드 설명 (DESCRIPTION)</label>
        <textarea id="embedContent" rows="3" placeholder="설명 입력"></textarea>
      </div>
      <div class="field">
        <label>임베드 이미지 첨부 (선택)</label>
        <div class="img-upload-box" onclick="document.getElementById('embedFile').click()">
          <span class="img-upload-text">📁 파일 탐색기 열기</span>
          <input type="file" id="embedFile" accept="image/*" onchange="handleFileSelect(this, 'embed')">
        </div>
        <div id="preview-container-embed" class="img-preview-container">
          <img id="preview-embed" class="img-preview" src="" alt="preview">
          <button class="remove-img-btn" onclick="clearImage('embed')">✕</button>
        </div>
      </div>
      <button class="btn" onclick="sendSingle('embed')">임베드 전송</button>
    </div>

    <!-- TERROR TAB -->
    <div id="tab-terror" class="tab-content">
      <div class="field">
        <label for="terrorMsg1">메시지 반복 전송</label>
        <textarea id="terrorMsg1" rows="2" placeholder="1번 반복 메시지"></textarea>
        <button class="btn" id="btn-1" onclick="toggleTerror(1, 'normal')">1번 전송</button>
      </div>
      <div class="field" style="margin-top: 16px;">
        <label for="terrorMsg2">핑,메시지 반복 전송</label>
        <textarea id="terrorMsg2" rows="2" placeholder="2번 반복 메시지"></textarea>
        <button class="btn" id="btn-2" onclick="toggleTerror(2, 'ping')">2번 전송</button>
      </div>
      <div class="field" style="margin-top: 16px;">
        <label for="terrorMsg3">테러</label>
        <textarea id="terrorMsg3" rows="2" placeholder="3번 반복 메시지"></textarea>
        <button class="btn" id="btn-3" onclick="toggleTerror(3, 'cross')">3번 전송</button>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script>
    const COLOR_MAP = {
      Red: 16711680, Orange: 16753920, Yellow: 16776960, Green: 65280,
      Blue: 3447003, Indigo: 10181046, Purple: 10053324, White: 16777215, Black: 1710618
    };

    const DISCORD_AVATARS = {
      blue: 'https://cdn.discordapp.com/embed/avatars/0.png',
      gray: 'https://cdn.discordapp.com/embed/avatars/1.png',
      green: 'https://cdn.discordapp.com/embed/avatars/2.png',
      orange: 'https://cdn.discordapp.com/embed/avatars/3.png',
      red: 'https://cdn.discordapp.com/embed/avatars/4.png',
      pink: 'https://cdn.discordapp.com/embed/avatars/5.png'
    };

    let sendingStates = { 1: false, 2: false, 3: false };
    let attachedFiles = { msg: null, embed: null };
    let profileFiles = { msg: null, embed: null };

    window.addEventListener('DOMContentLoaded', () => {
      const savedUrl = localStorage.getItem('saved_webhook_url');
      if (savedUrl) {
        document.getElementById('webhookUrl').value = savedUrl;
      }
    });

    document.addEventListener('paste', (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.type.indexOf('image') !== -1) {
          const blob = item.getAsFile();
          const activeTab = document.querySelector('.tab-content.active').id;
          const targetKey = activeTab === 'tab-message' ? 'msg' : (activeTab === 'tab-embed' ? 'embed' : null);
          if (targetKey) {
            const presetSelect = document.getElementById(`${targetKey}AvatarPreset`);
            if (presetSelect.value === 'custom') {
              setProfileFile(targetKey, blob);
              showToast('프로필 커스텀 이미지가 붙여넣기 되었습니다.');
            } else {
              setAttachedFile(targetKey, blob);
              showToast('본문 이미지가 붙여넣기 되었습니다.');
            }
          }
          break;
        }
      }
    });

    function saveWebhook(url) {
      localStorage.setItem('saved_webhook_url', url.trim());
    }

    function updatePresetPreview(key) {
      const val = document.getElementById(`${key}AvatarPreset`).value;
      const customBox = document.getElementById(`${key}CustomAvatarBox`);
      const previewImg = document.getElementById(`${key}AvatarPreviewImg`);

      if (val === 'custom') {
        customBox.style.display = 'block';
        if (profileFiles[key]) {
          const reader = new FileReader();
          reader.onload = (e) => { previewImg.src = e.target.result; };
          reader.readAsDataURL(profileFiles[key]);
        } else {
          previewImg.src = 'https://cdn.discordapp.com/embed/avatars/0.png';
        }
      } else {
        customBox.style.display = 'none';
        previewImg.src = DISCORD_AVATARS[val] || DISCORD_AVATARS.blue;
      }
    }

    function handleProfileFileSelect(input, key) {
      if (input.files && input.files[0]) {
        setProfileFile(key, input.files[0]);
      }
    }

    function setProfileFile(key, file) {
      profileFiles[key] = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById(`${key}AvatarPreviewImg`).src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleFileSelect(input, key) {
      if (input.files && input.files[0]) {
        setAttachedFile(key, input.files[0]);
      }
    }

    function setAttachedFile(key, file) {
      attachedFiles[key] = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById(`preview-${key}`).src = e.target.result;
        document.getElementById(`preview-container-${key}`).classList.add('active');
      };
      reader.readAsDataURL(file);
    }

    function clearImage(key) {
      attachedFiles[key] = null;
      document.getElementById(`${key}File`).value = '';
      document.getElementById(`preview-${key}`).src = '';
      document.getElementById(`preview-container-${key}`).classList.remove('active');
    }

    function showToast(msg, isErr = false) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.className = `toast ${isErr ? 'error' : 'success'}`;
      setTimeout(() => { toast.className = 'toast'; }, 3000);
    }

    function switchTab(tab, event) {
      ['message', 'embed', 'terror'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.remove('active');
      });
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(`tab-${tab}`).classList.add('active');
      if (event && event.target) {
        event.target.classList.add('active');
      }
    }

    async function sendSingle(type) {
      const url = document.getElementById('webhookUrl').value.trim();
      if (!url) return showToast('웹훅 주소를 입력해주세요.', true);

      const username = document.getElementById(`${type}Username`).value.trim();
      const presetVal = document.getElementById(`${type}AvatarPreset`).value;
      const bodyFile = attachedFiles[type];
      const profileFile = profileFiles[type];

      const formData = new FormData();
      let payload = {};

      if (username) payload.username = username;

      if (presetVal === 'custom' && profileFile) {
        payload.avatar_url = 'attachment://profile_image.png';
      } else {
        payload.avatar_url = DISCORD_AVATARS[presetVal] || DISCORD_AVATARS.blue;
      }

      if (type === 'message') {
        const content = document.getElementById('msgContent').value.trim();
        if (!content && !bodyFile) return showToast('메시지 내용이나 이미지를 입력해주세요.', true);
        if (content) payload.content = content;
      } else {
        const title = document.getElementById('embedTitle').value.trim();
        const content = document.getElementById('embedContent').value.trim();
        const embedColorKey = document.getElementById('embedColor').value;
        if (!title && !content && !bodyFile) return showToast('제목, 내용, 이미지 중 하나는 입력해야 합니다.', true);

        const embedObj = {
          title: title || undefined,
          description: content || undefined,
          color: COLOR_MAP[embedColorKey] || 3447003
        };

        if (bodyFile) {
          embedObj.image = { url: 'attachment://body_image.png' };
        }

        payload.embeds = [embedObj];
      }

      const hasFiles = bodyFile || (presetVal === 'custom' && profileFile);

      if (hasFiles) {
        formData.append('payload_json', JSON.stringify(payload));
        if (presetVal === 'custom' && profileFile) {
          formData.append('files[0]', profileFile, 'profile_image.png');
        }
        if (bodyFile) {
          formData.append(presetVal === 'custom' && profileFile ? 'files[1]' : 'files[0]', bodyFile, 'body_image.png');
        }
      }

      try {
        let res;
        if (hasFiles) {
          res = await fetch(url, { method: 'POST', body: formData });
        } else {
          res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }

        if (res.status === 200 || res.status === 204) {
          showToast('성공적으로 전송되었습니다!');
          if (bodyFile) clearImage(type);
        } else {
          showToast(`전송 실패 (${res.status})`, true);
        }
      } catch (e) {
        showToast('전송 중 오류 발생', true);
      }
    }

    async function toggleTerror(num, mode) {
      const url = document.getElementById('webhookUrl').value.trim();
      const content = document.getElementById(`terrorMsg${num}`).value.trim();
      const btn = document.getElementById(`btn-${num}`);

      if (sendingStates[num]) {
        sendingStates[num] = false;
        btn.classList.remove('running');
        btn.innerText = `${num}번 전송`;
        showToast(`${num}번 반복 전송 중지`);
        return;
      }

      if (!url) return showToast('웹훅 주소를 입력해주세요.', true);
      if (!content) return showToast(`${num}번 메시지 내용을 입력해주세요.`, true);

      sendingStates[num] = true;
      btn.classList.add('running');
      btn.innerText = `${num}번 중지`;
      showToast(`${num}번 반복 전송 시작!`);

      let toggleCross = true;

      while (sendingStates[num]) {
        let sendContent = content;
        if (mode === 'ping') sendContent = `@everyone @here ${content}`;
        else if (mode === 'cross') {
          if (toggleCross) sendContent = `@everyone @here ${content}`;
          else sendContent = `# MY WEBHOOK : ${url}\n@everyone @here`;
        }

        const payload = {
          content: sendContent,
          username: 'User_' + Math.random().toString(36).substring(2, 8),
          avatar_url: `https://robohash.org/${Math.random().toString(36).substring(2, 10)}.png`
        };

        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const status = res.status;

          if (status === 429) {
            await new Promise(r => setTimeout(r, 1000));
          } else {
            if (mode === 'cross' && (status === 200 || status === 204)) toggleCross = !toggleCross;
            await new Promise(r => setTimeout(r, 50));
          }
        } catch (e) {
          await new Promise(r => setTimeout(r, 1000));
        }
      }
    }
  </script>
</body>
</html>
